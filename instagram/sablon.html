<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<title>Periler Mutfakta – Instagram menü şablonu</title>
<!--
  Instagram görsellerinin şablonu. Görselleri yeniden üretmek için:
    node tools/instagram-gorselleri.js
  Menü adları, içerik ve fiyatlar assets/js/products.js dosyasından okunur.
  Elle bakmak için: sablon.html?f=post | ?f=story | ?f=single&m=1
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --pepper: #E5383B; --pepper-50: #FDEEEE;
    --sunset: #F3722C; --sunset-50: #FEF3EC; --sunset-700: #B44C14;
    --honey: #F9C74F; --honey-50: #FEF9EA;
    --leaf: #4A7C59; --leaf-50: #EEF5F0; --leaf-700: #3A6347;
    --cream: #FFFDF9; --cream-200: #FCEFDF; --cream-300: #F6E2C9;
    --cocoa: #2B1E1A; --cocoa-500: #7A6157;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--cream); }
  body { font-family: 'Nunito', system-ui, sans-serif; color: var(--cocoa); }
  .canvas { position: relative; overflow: hidden; width: 1080px; height: 1350px; background: var(--cream);
    background-image: radial-gradient(circle at 12% 8%, rgba(249,199,79,.28), transparent 32%),
                      radial-gradient(circle at 92% 96%, rgba(229,56,59,.14), transparent 34%),
                      radial-gradient(circle at 96% 30%, rgba(243,114,44,.10), transparent 26%); }
  .canvas.story { height: 1920px; }
  .serif { font-family: 'Fraunces', Georgia, serif; }

  /* Dekor: peri tozu yıldızları */
  .spark { position: absolute; color: var(--honey); }
  .spark svg { display: block; width: 100%; height: 100%; }

  /* Üst marka satırı */
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 78px; height: 78px; filter: drop-shadow(0 6px 14px rgba(122,52,20,.25)); }
  .brand b { display: block; font-family: 'Fraunces', serif; font-weight: 600; font-size: 38px; letter-spacing: -.01em; line-height: 1; }
  .brand small { display: block; margin-top: 6px; font-size: 15px; font-weight: 900; letter-spacing: .22em; text-transform: uppercase; color: var(--sunset-700); }

  .title { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -.02em; line-height: .95; }
  .title .u { position: relative; color: var(--pepper); white-space: nowrap; }
  .title .u svg { position: absolute; left: 0; bottom: -14px; width: 100%; height: 22px; color: var(--honey); }
  .lead { color: var(--cocoa-500); font-weight: 700; }

  /* Menü kartları (toplu gönderi / hikâye) */
  .card { position: relative; display: grid; grid-template-columns: 236px 1fr; gap: 30px; align-items: center;
    background: #fff; border-radius: 40px; padding: 26px 32px 26px 26px; box-shadow: 0 24px 60px -24px rgba(122,52,20,.38); border: 1px solid rgba(43,30,26,.05); }
  .photo { position: relative; width: 236px; height: 236px; }
  .photo img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 8px solid #fff; box-shadow: 0 10px 30px -10px rgba(122,52,20,.45); }
  .no { position: absolute; left: -6px; top: -6px; width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-family: 'Fraunces', serif; font-weight: 600; font-size: 38px; border: 6px solid #fff; box-shadow: 0 8px 20px -8px rgba(0,0,0,.35); }
  .kicker { font-size: 16px; font-weight: 900; letter-spacing: .2em; text-transform: uppercase; }
  .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 50px; line-height: 1; letter-spacing: -.01em; margin-top: 6px; }
  .items { display: flex; flex-wrap: wrap; gap: 8px 10px; margin-top: 16px; }
  .items span { display: inline-flex; align-items: center; gap: 7px; font-size: 21px; font-weight: 800; padding: 6px 14px 6px 10px; border-radius: 999px; }
  .items svg { width: 18px; height: 18px; flex: none; }
  .price { position: absolute; right: -14px; top: -22px; transform: rotate(4deg); color: var(--cocoa); background: var(--honey);
    border-radius: 22px; padding: 10px 20px 12px; text-align: center; box-shadow: 0 12px 24px -12px rgba(185,134,26,.9); }
  .price small { display: block; font-size: 14px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
  .price b { display: block; font-family: 'Fraunces', serif; font-weight: 700; font-size: 40px; line-height: 1; }

  /* Toplu gönderi (1080×1350) için sıkı yerleşim */
  .compact .card { grid-template-columns: 186px 1fr; gap: 26px; padding: 22px 30px 22px 22px; border-radius: 34px; }
  .compact .photo { width: 186px; height: 186px; }
  .compact .photo img { border-width: 6px; }
  .compact .no { width: 60px; height: 60px; font-size: 31px; border-width: 5px; }
  .compact .name { font-size: 44px; }
  .compact .items { margin-top: 12px; gap: 7px 8px; }
  .compact .items span { font-size: 19px; padding: 5px 12px 5px 9px; }
  .compact .price { padding: 8px 18px 10px; top: -18px; }
  .compact .price b { font-size: 36px; }

  .t-sunset { --c: var(--sunset); --c50: var(--sunset-50); --c7: var(--sunset-700); }
  .t-leaf { --c: var(--leaf); --c50: var(--leaf-50); --c7: var(--leaf-700); }
  .t-pepper { --c: var(--pepper); --c50: var(--pepper-50); --c7: #AD2427; }
  .t-sunset .no, .t-leaf .no, .t-pepper .no { background: var(--c); }
  .kicker { color: var(--c7); }
  .items span { background: var(--c50); color: var(--cocoa); }
  .items svg { color: var(--c); }

  /* Alt bilgi */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .wa { display: inline-flex; align-items: center; gap: 14px; background: var(--leaf); color: #fff; border-radius: 999px; padding: 14px 28px 14px 18px; font-weight: 900; font-size: 30px; box-shadow: 0 14px 28px -14px rgba(58,99,71,.9); }
  .wa svg { width: 38px; height: 38px; }
  .note { font-size: 19px; font-weight: 800; color: var(--cocoa-500); text-align: right; line-height: 1.35; }
  .note b { color: var(--cocoa); }

  /* Tek menü (kaydırmalı gönderi) */
  .single .hero { position: absolute; left: 0; right: 0; top: 0; height: 640px; }
  .single .hero img { width: 100%; height: 100%; object-fit: cover; }
  .single .hero::after { content: ''; position: absolute; inset: auto 0 0 0; height: 160px; background: linear-gradient(transparent, var(--cream)); }
  .single .sheet { position: absolute; left: 56px; right: 56px; top: 520px; bottom: 150px; background: #fff; border-radius: 48px; padding: 54px 60px 44px;
    box-shadow: 0 30px 70px -30px rgba(122,52,20,.45); border: 1px solid rgba(43,30,26,.05); display: flex; flex-direction: column; }
  .single .no { left: auto; right: 54px; top: -50px; width: 104px; height: 104px; font-size: 56px; border-width: 8px; }
  .single .name { font-size: 78px; margin-top: 10px; }
  .single .tag { margin-top: 12px; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 28px; color: var(--cocoa-500); }
  .single ul { list-style: none; margin-top: 28px; display: grid; gap: 14px; }
  .single li { display: flex; align-items: center; gap: 16px; font-size: 32px; font-weight: 800; }
  .single li svg { width: 30px; height: 30px; color: var(--c); flex: none; }
  .single .prices { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .single .prices div { border-radius: 26px; background: var(--c50); padding: 16px 10px; text-align: center; }
  .single .prices div:first-child { background: var(--c); color: #fff; }
  .single .prices small { display: block; font-size: 18px; font-weight: 900; }
  .single .prices b { display: block; margin-top: 4px; font-family: 'Fraunces', serif; font-weight: 700; font-size: 40px; line-height: 1; }
  .single .bottom { position: absolute; left: 56px; right: 56px; bottom: 44px; }
  .single .brand img { width: 62px; height: 62px; }
  .single .brand b { font-size: 30px; }
  .single .brand small { font-size: 13px; }
  .single .wa { font-size: 26px; padding: 12px 24px 12px 16px; }
  .single .wa svg { width: 32px; height: 32px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/products.js"></script>
<script>
(function () {
  const CFG = window.SITE_CONFIG;
  const params = new URLSearchParams(location.search);
  const format = params.get('f') || 'post';
  const MENUS = window.MENU.products.filter((p) => p.category === 'gun-menuleri');
  const nf = new Intl.NumberFormat('tr-TR');
  const money = (n) => `${nf.format(n)} ₺`;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const img = (name) => `../assets/img/${name}-1280.webp`;
  const SPARK = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c.6 5.9 6.1 11.4 12 12-5.9.6-11.4 6.1-12 12-.6-5.9-6.1-11.4-12-12C5.9 11.4 11.4 5.9 12 0Z"/></svg>';
  const SPARK_SM = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.5 4.7 5.3 9.5 10 10-4.7.5-9.5 5.3-10 10-.5-4.7-5.3-9.5-10-10 4.7-.5 9.5-5.3 10-10Z"/></svg>';
  const WA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4ZM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8Zm8.4-18.2A11.8 11.8 0 0 0 1.8 17.9L.1 24l6.3-1.7A11.8 11.8 0 0 0 24 12c0-3.2-1.2-6.1-3.6-8.4Z"/></svg>';
  const SWOOSH = '<svg viewBox="0 0 200 12" preserveAspectRatio="none"><path d="M2 9 C 50 2, 150 2, 198 8" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>';
  const sparks = (list) => list.map(([x, y, s, o]) => `<span class="spark" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;opacity:${o || 1}">${SPARK}</span>`).join('');
  const phone = CFG.displayPhone || '';
  const site = (CFG.siteUrl || '').replace(/^https?:\/\//, '').replace(/\/$/, '');

  const brand = `<div class="brand"><img src="../favicon.svg" alt="" /><span><b>${esc(CFG.brandName)}</b><small>${esc(CFG.city || '')} · Ev yapımı lezzetler</small></span></div>`;
  const theme = (m) => `t-${m.menuTheme || 'sunset'}`;
  const heroOf = (m) => (m.gallery && m.gallery[1]) || m.image;

  function card(m) {
    const first = m.options[0];
    return `<article class="card ${theme(m)}">
      <div class="photo"><img src="${img(heroOf(m))}" alt="" /><span class="no">${m.menuNo}</span></div>
      <div>
        <p class="kicker">${m.menuNo}. Menü · ${esc(first.label)}</p>
        <h3 class="name">${esc(m.name)}</h3>
        <div class="items">${m.items.map((it) => `<span>${SPARK_SM}${esc(it)}</span>`).join('')}</div>
      </div>
      <div class="price"><small>${esc(first.label)}</small><b>${money(first.price)}</b></div>
    </article>`;
  }
  const others = () => {
    const labels = MENUS[0] ? MENUS[0].options.slice(1).map((o) => o.label.replace(' Kişilik', '')) : [];
    return `${labels.length ? `<b>${labels.join(' ve ')} kişilik</b> seçenekler de var<br />` : ''}Sipariş için WhatsApp'tan yazın 🧚`;
  };

  let html = '';
  if (format === 'post' || format === 'story') {
    const story = format === 'story';
    html = `<div class="canvas ${story ? 'story' : 'compact'}">
      ${sparks(story ? [[930, 140, 46], [990, 240, 22, .8]] : [[925, 56, 44], [990, 140, 20, .8]])}
      <div style="padding:${story ? '200px 64px 0' : '56px 64px 0'}">
        ${brand}
        <h1 class="title" style="margin-top:${story ? 48 : 30}px;font-size:${story ? 124 : 92}px">Gün <span class="u">Menüleri${SWOOSH}</span></h1>
        <p class="lead" style="margin-top:${story ? 44 : 30}px;font-size:${story ? 32 : 25}px">Altın günü, kabul, mevlit ve doğum günleriniz için<br />tuzlu-tatlı 5 çeşit, servise hazır kapınızda.</p>
        <div style="display:grid;gap:${story ? 40 : 26}px;margin-top:${story ? 60 : 38}px">${MENUS.map(card).join('')}</div>
      </div>
      <div class="foot" style="position:absolute;left:64px;right:64px;bottom:${story ? 190 : 44}px">
        <span class="wa">${WA}${esc(phone)}</span>
        <p class="note">${others()}</p>
      </div>
    </div>`;
  } else {
    const m = MENUS.find((x) => String(x.menuNo) === (params.get('m') || '1')) || MENUS[0];
    html = `<div class="canvas single ${theme(m)}">
      <div class="hero"><img src="${img(m.image)}" alt="" /></div>
      <div class="sheet">
        <span class="no">${m.menuNo}</span>
        <p class="kicker" style="font-size:20px">Gün Menüsü · ${m.menuNo}</p>
        <h1 class="name">${esc(m.name)}</h1>
        ${m.menuTagline ? `<p class="tag">${esc(m.menuTagline)}</p>` : ''}
        <ul>${m.items.map((it) => `<li>${SPARK_SM}${esc(it)}</li>`).join('')}</ul>
        <div class="prices">${m.options.map((o) => `<div><small>${esc(o.label)}</small><b>${money(o.price)}</b></div>`).join('')}</div>
      </div>
      <div class="bottom foot">${brand}<span class="wa">${WA}${esc(phone)}</span></div>
      ${sparks([[960, 560, 34], [40, 600, 22, .8]])}
    </div>`;
  }
  document.getElementById('root').innerHTML = html;
})();
</script>
</body>
</html>
